name: Production error monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run detection without creating or updating issues."
        required: true
        type: boolean
        default: false
      window_minutes:
        description: "Trailing log window to inspect."
        required: false
        type: number
        default: 30
      lookback_hours:
        description: "Production update lookback window."
        required: false
        type: number
        default: 36

permissions:
  id-token: write
  contents: read
  actions: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      CLOUDWATCH_LOG_GROUPS: ${{ vars.CLOUDWATCH_LOG_GROUPS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MONITOR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install monitor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-monitor.txt

      - name: Run production error monitor
        run: |
          dry_run=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            dry_run="--dry-run"
          fi

          python scripts/prod_error_monitor.py \
            --config infra/monitoring/prod-error-monitor.json \
            --window-minutes "${{ github.event_name == 'workflow_dispatch' && inputs.window_minutes || 30 }}" \
            --lookback-hours "${{ github.event_name == 'workflow_dispatch' && inputs.lookback_hours || 36 }}" \
            ${dry_run}
