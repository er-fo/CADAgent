# Minimal reference template for reverse proxying the legacy backend.
# This file is versioned for documentation/manual rollout and is not
# automatically applied by deploy.yml. For production, add a dedicated
# TLS server block on 443 with valid ssl_certificate/ssl_certificate_key.
server {
    listen 80;
    server_name ws.cadagentpro.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }
}
